spring.application.name=memory-match-multiplayer-backend

# JWT Configuration
app.jwt.secret=FFzOJhBt0Sbn8TosjnYO9xPUr8Slc+ZGSI8U9YyDzL0=
app.jwt.expiration=3600000
app.jwt.refresh-expiration=86400000

# DB properties
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sec-test-db}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect